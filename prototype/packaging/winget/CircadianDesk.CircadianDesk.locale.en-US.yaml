ShortDescription: Local-first, zero-cloud Windows 10/11 display and smart-light circadian orchestrator.
Description: >-
  Circadian Desk synchronizes your laptop/monitor hardware backlight (WMI & debounced DDC/CI)
  and zero-admin GPU color temperature (Magnification.dll) along a smooth MIRED-continuous
  circadian curve calibrated to CIE S 026 and Brown et al. (2022) visual-comfort guidelines.
  Features automatic Windows 11 HDR Auto-Pause, OLED/QD-OLED >=42 nit hardware safety floor,
  Modern Standby (S0ix) wake sync, an interactive 24-hour curve scrubber, foreground auto-pause
  for creative apps and fullscreen games, and optional local LAN smart-bulb sync (Philips Hue,
  WiZ, Home Assistant MQTT). 100% local execution with zero cloud accounts and zero telemetry.
