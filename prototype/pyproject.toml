[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-light-orchestrator"
version = "1.0.0"
description = "Eye-level multi-spectral circadian light orchestrator (Pure Track A v6.2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
circadian-desk = "orchestrator.daemon:main"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spectral*", "orchestrator*", "firmware*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
